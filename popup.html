<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GTA 6 Spoiler Shield</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>GTA 6 Spoiler Shield</h1>
<form><label><input id="x" type="checkbox"> Blur matching X posts</label>
<label><input id="youtube" type="checkbox"> Blur matching YouTube titles and thumbnails</label>
<label for="terms">Blocked keywords</label>
<textarea id="terms" rows="9" spellcheck="false"></textarea>
<p>Paste keywords separated by newlines or commas.</p>
<button type="submit">Save</button> <button type="button" id="reset">Load starter list</button>
<p id="status" role="status"></p></form>
<script src="settings.js"></script><script src="popup.js"></script></body></html>
